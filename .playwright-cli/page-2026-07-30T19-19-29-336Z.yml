            - generic [ref=e70]:
              - term [ref=e71]: Description
              - definition [ref=e72]: Head and bust of a woman in high relief. The left hand grasps her garment while the right, with two fingers extended, touchers her face. Her expression is pensive. She wears three necklaces, earrings and two rings on her left little finger. A brooch with a six-pointed ornament is affixed to her garment. Behind her is a draped cloth supported by two medallions adorned with sheaths of wheat, in front of a patterned background.
              - term [ref=e73]: Inscriptions
              - definition [ref=e74]: The inscriptions carved on this relief bust, written in Aramaic, identify the figure as a woman named Haliphat and date her death to the year 231.
              - term [ref=e75]: Label
              - definition [ref=e76]: The inscriptions carved on this relief bust, written in Aramaic, identify the figure as a woman named Haliphat and date her death to the year 231 C.E. The bust is from Palmyra, a city in southern Syria that flourished during the Roman Empire as a caravan oasis on the trade route linking the Mediterranean with West and Central Asia.
              - definition [ref=e77]: Many members of Palmyra's prosperous merchant class commissioned such funerary busts depicting fashionably dressed individuals; women often wear elaborate jewelry. The busts covered the openings of burial compartments in family tombs located in the desert outside Palmyra.
              - term [ref=e78]: Provenance
              - definition [ref=e79]: To 1908
              - definition [ref=e80]: Joseph Marcopoli, Aleppo, Syria, to 1908 [1]
              - definition [ref=e81]: From 1908 to 1919
              - definition [ref=e82]: Charles Lang Freer (1854-1919), purchased from Joseph Marcopoli, Aleppo, in 1908 [2]
              - definition [ref=e83]: From 1920
              - definition [ref=e84]: Freer Gallery of Art, gift of Charles Lang Freer in 1920 [3]
              - definition [ref=e85]: "Notes:"
              - definition [ref=e86]: "[1] See Reserved Miscellaneous List, R. 5601, Freer Gallery of Art and Arthur M. Sackler Gallery Archives."
              - definition [ref=e87]: "[2] See note 1."
              - definition [ref=e88]: "[3] The original deed of Charles Lang Freer's gift was signed in 1906. The collection was received in 1920 upon the completion of the Freer Gallery."
              - term [ref=e89]: Collection

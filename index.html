<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      There is no favicon in this project, and until 2 Sep 2026 there was nothing saying so, so
      every browser asked for one and every page load logged
      "Failed to load resource: the server responded with a status of 404".
      Harmless, and not nothing: three `qa-net` arms assert that a page raises no console error,
      and they were green only because Playwright's old headless shell does not request a
      favicon at all. Moving those arms to the new headless mode — which a peer connection needs
      — surfaced it on every page at once. `data:,` is an empty data URI: it satisfies the
      declaration without a request, so the 404 is gone in every browser and on the deployed site
      rather than filtered in one harness.
    -->
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TOTAL CLAUDE — Siege of Rome</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="/src/ui/hud.css" />
    <link rel="stylesheet" href="/src/ui/menu.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="viewport"></canvas>
      <div id="hud-root"></div>
      <div id="menu-root"></div>
      <div id="loading">
        <div class="load-inner">
          <div class="eagle">
            <svg viewBox="0 0 64 64" width="88" height="88" aria-hidden="true">
              <path
                fill="currentColor"
                d="M32 4l4 8 10-4-3 9 11 1-8 6 8 6-11 1 3 9-10-4-4 8-4-8-10 4 3-9-11-1 8-6-8-6 11-1-3-9 10 4z"
                opacity=".85"
              />
            </svg>
          </div>
          <h1>TOTAL CLAUDE</h1>
          <h2>The Siege of Rome &middot; 271 AD</h2>
          <div class="bar"><i id="load-bar"></i></div>
          <p id="load-text">Mustering the legions&hellip;</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TOTAL CLAUDE — the Siege of Rome, 271 AD</title>
    <meta
      name="description"
      content="Nine thousand soldiers, simulated one at a time, storm the Aurelian Wall of Rome in 271 AD. Carthage and Pydna too. No install — it runs in your browser."
    />
    <link rel="canonical" href="https://total-claude.vercel.app/" />
    <!-- `--panel-bg`'s darkest stop in `src/ui/hud.css`, so the browser chrome matches the HUD. -->
    <meta name="theme-color" content="#100c09" />

    <!--
      ═══════════════════════════════════════════════════════════════════════════════════════
      Icons. Every one of these must RESOLVE, and that is the whole history of this block.
      ═══════════════════════════════════════════════════════════════════════════════════════

      There was no favicon in this project, and until 2 Sep 2026 nothing said so, so every
      browser asked for one and every page load logged "Failed to load resource: the server
      responded with a status of 404". Harmless, and not nothing: three `qa-net` arms assert
      that a page raises no console error, and they were green only because Playwright's old
      headless shell does not request a favicon at all. Moving those arms to the new headless
      mode — which a peer connection needs — surfaced it on every page at once. The fix then
      was `href="data:,"`, an empty data URI, which satisfies the declaration without a request.

      This replaces it with real files, so the constraint is now the harder one: a declared icon
      that 404s is the *same* console error, and it would have to resolve on three servers with
      three different rules — the Vite dev server, `npm run host`'s static server, and Vercel.
      `public/<x>` maps to `/<x>` on all three, which is why these live there and not in
      `public/assets/` (`tools/optimize-assets.mjs` deletes `dist/assets` wholesale and re-emits
      only what the texture manifest lists, so an image parked there survives `vite build` and
      is gone by the end of `npm run build`).

      `tools/qa-brand.mjs` is the part that can fail: it fetches every URL declared in this head
      off a running server, checks the status, the content type and the decoded pixel
      dimensions, and refuses a card that is still the placeholder. A check that asserts a
      `<meta>` tag is *present* cannot fail in the way that matters.

      Generated by `tools/make-brand.mjs` — an SVG authored in that file, rasterised here. No
      byte of it was downloaded, which is also the shortest possible licence audit.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      The link preview. `og:image` is absolute because it must be: a relative one is ignored by
      every unfurler there is, and this is the single most common way a card silently ships as
      a bare grey rectangle.

      The image is a real frame of this game, cropped to 1200x630 and given a scrim and a
      wordmark, because at the ~400 px a preview actually renders, a dark battlefield full of
      four-pixel men is texture rather than a picture.

      **Which frame is not named here on purpose.** This comment used to say `press-rome-wall`
      and the card has been built from `press-rome-line` for as long as there has been a card:
      `buildCard()` in `tools/make-brand.mjs` uses `PLATES[0]`, and that is the one place the
      answer lives. A second copy of it in an HTML comment is a copy that goes stale, and this
      one did.

      Nothing in `public/press/` is referenced from this file, and that is a constraint rather
      than an accident — the backdrop's plates must stay off the critical path. `og/` is a
      different thing: it is fetched by an unfurler, never by a visitor.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Total Claude" />
    <meta property="og:url" content="https://total-claude.vercel.app/" />
    <meta property="og:title" content="Total Claude — the Siege of Rome, 271 AD" />
    <meta
      property="og:description"
      content="The Juthungi are at the Aurelian Wall in the spring of 271. Nine thousand soldiers are simulated one at a time — every ladder, every man on it, and every man who pushes it off. Carthage and Pydna besides. It runs in a browser."
    />
    <meta property="og:image" content="https://total-claude.vercel.app/og/total-claude.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Aurelian Wall of Rome under assault at mid-morning: siege towers and ladders against the curtain, the Juthungi host massed on the field below."
    />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Total Claude — the Siege of Rome, 271 AD" />
    <meta
      name="twitter:description"
      content="Nine thousand soldiers, simulated one at a time, storm the Aurelian Wall of Rome in 271 AD. It runs in your browser."
    />
    <meta name="twitter:image" content="https://total-claude.vercel.app/og/total-claude.jpg" />
    <meta
      name="twitter:image:alt"
      content="The Aurelian Wall of Rome under assault at mid-morning: siege towers and ladders against the curtain, the Juthungi host massed on the field below."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="/src/ui/hud.css" />
    <link rel="stylesheet" href="/src/ui/menu.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="viewport"></canvas>
      <div id="hud-root"></div>
      <div id="menu-root"></div>
      <div id="loading">
        <div class="load-inner">
          <div class="eagle">
            <svg viewBox="0 0 64 64" width="88" height="88" aria-hidden="true">
              <path
                fill="currentColor"
                d="M32 4l4 8 10-4-3 9 11 1-8 6 8 6-11 1 3 9-10-4-4 8-4-8-10 4 3-9-11-1 8-6-8-6 11-1-3-9 10 4z"
                opacity=".85"
              />
            </svg>
          </div>
          <h1>TOTAL CLAUDE</h1>
          <h2>The Siege of Rome &middot; 271 AD</h2>
          <div class="bar"><i id="load-bar"></i></div>
          <p id="load-text">Mustering the legions&hellip;</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

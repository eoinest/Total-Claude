# The relay's deployment descriptor. Never applied — there is no Cloudflare account here.
#
# Kept beside `worker.ts` so that "deploy the relay" is `npx wrangler deploy` from this
# directory rather than a research task. `docs/MULTIPLAYER.md` §3 costs it: ~12,600 incoming
# messages per ten-minute two-player match, billed at 20:1 = 630 requests, and 76.8 GB-s of
# duration. Free plan 100,000 requests/day gives ~158 matches a day and the binding constraint
# is requests, not duration. **Check first whether Durable Objects are on the free plan at
# all** — §3 flags that as unverified and it decides whether the free row exists.
#
# `new_sqlite_classes` rather than `new_classes`: SQLite-backed Durable Objects are the ones
# available without a paid plan at the time of writing. Nothing here stores anything — a room
# is entirely in memory and dies with the match — so the storage backend only matters for
# whether the class can be created at all.

name = "total-claude-relay"
main = "worker.ts"
compatibility_date = "2026-08-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomObject"]

[observability]
enabled = true

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TOTAL CLAUDE — Model Viewer</title>
    <meta
      name="description"
      content="Every soldier, horse and elephant in Total Claude, built from code and turned around in your hands — kit, skeleton, animation clips and the atlases they are drawn from."
    />
    <link rel="canonical" href="https://total-claude.vercel.app/viewer.html" />
    <meta name="theme-color" content="#100c09" />

    <!--
      The same icon set as `index.html`, and for the same reason it is spelled out there rather
      than left to the browser: three `qa-net` arms assert that a page raises no console error,
      and an icon that 404s is a console error. This is the second entry point (see
      `rollupOptions.input` in `vite.config.ts`), so it is a second head that has to be right.
      Generated by `tools/make-brand.mjs`; checked against a live server by `tools/qa-brand.mjs`.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Total Claude" />
    <meta property="og:url" content="https://total-claude.vercel.app/viewer.html" />
    <meta property="og:title" content="Total Claude — Model Viewer" />
    <meta
      property="og:description"
      content="Every soldier, horse and elephant in Total Claude, built from code and turned around in your hands — kit, skeleton, animation clips and the atlases they are drawn from."
    />
    <meta property="og:image" content="https://total-claude.vercel.app/og/total-claude.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Aurelian Wall of Rome under assault at mid-morning: siege towers and ladders against the curtain, the Juthungi host massed on the field below."
    />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Total Claude — Model Viewer" />
    <meta
      name="twitter:description"
      content="Every soldier, horse and elephant in Total Claude, built from code and turned around in your hands."
    />

      content="The Aurelian Wall of Rome under assault at mid-morning: siege towers and ladders against the curtain, the Juthungi host massed on the field below."
    />

    <link rel="stylesheet" href="/src/viewer/viewer.css" />
  </head>
